name: heico-docker

services:
  chroma:
    build:
      context: .
      dockerfile: Dockerfile.chroma
    # Expose the ChromaDB HTTP API
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    # Simple restart policy; healthchecks vary between Chroma versions so skip here

  api:
    build:
      dockerfile: ./api/Dockerfile
      context: .
    env_file:
      .env
    ports:
      - "8080:8080"
    environment:
      # Point API to ChromaDB's HTTP endpoint. Adjust your API code if it expects a
      # different var name (e.g., CHROMA_URL) — this sets DB_URL for backward compat.
      DB_URL: http://chroma:8000
    depends_on:
      - chroma

  web:
    build:
      dockerfile: Dockerfile
      context: ./web
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
      - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
      - VITE_AUTH0_AUDIENCE=${VITE_AUTH0_AUDIENCE}

  streamlit:
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - chroma

volumes:
  chroma_data:
